name: Production CI & Zero-Warning Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test-and-build:
    name: Go Backend Verification (Race Detector & Lint)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: blobcloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Go Format & Lint Check
        working-directory: backend
        run: |
          go vet ./...

      - name: Run Test Suite with Race Detection
        working-directory: backend
        env:
          DB_URL: postgres://postgres:password@localhost:5432/blobcloud?sslmode=disable
          REDIS_URL: redis://localhost:6379
          STORAGE_PROVIDER: local
          LOCAL_STORAGE_DIR: ./tmp_storage
        run: |
          go test -race -v ./...

      - name: Multi-Binary Compilation Check
        working-directory: backend
        run: |
          go build -v ./cmd/...

  frontend-typecheck-and-build:
    name: Frontend TypeScript & Vite Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript Typecheck (Zero Warnings Gate)
        working-directory: frontend
        run: npx tsc -b

      - name: Production Vite Build
        working-directory: frontend
        run: npm run build
