global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "blobcloud-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8090", "host.docker.internal:8090"]
        labels:
          service: "blobcloud-api"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
