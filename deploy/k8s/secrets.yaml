apiVersion: v1
kind: Secret
metadata:
  name: blobcloud-secrets
  namespace: default
type: Opaque
stringData:
  DB_URL: "postgres://postgres:password@postgres-service:5432/blobcloud?sslmode=disable"
  REDIS_URL: "redis://redis-service:6379"
  JWT_SECRET: "replace-with-a-cryptographically-random-secret-key-32bytes"
  GEMINI_API_KEY: ""
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
