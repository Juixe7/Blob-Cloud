apiVersion: apps/v1
kind: Deployment
metadata:
  name: blobcloud-worker
  namespace: default
  labels:
    app.kubernetes.io/name: blobcloud-worker
    app.kubernetes.io/component: compute-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blobcloud-worker
  template:
    metadata:
      labels:
        app: blobcloud-worker
    spec:
      containers:
        - name: worker
          image: blobcloud-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: blobcloud-config
            - secretRef:
                name: blobcloud-secrets
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
