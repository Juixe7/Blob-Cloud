apiVersion: apps/v1
kind: Deployment
metadata:
  name: blobcloud-api
  namespace: default
  labels:
    app.kubernetes.io/name: blobcloud-api
    app.kubernetes.io/component: control-plane
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: blobcloud-api
  template:
    metadata:
      labels:
        app: blobcloud-api
    spec:
      containers:
        - name: api
          image: blobcloud-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
              name: http
          envFrom:
            - configMapRef:
                name: blobcloud-config
            - secretRef:
                name: blobcloud-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: blobcloud-api-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: blobcloud-api
  ports:
    - name: http
      port: 80
      targetPort: 8090
