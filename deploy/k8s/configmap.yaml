apiVersion: v1
kind: ConfigMap
metadata:
  name: blobcloud-config
  namespace: default
data:
  ENV: "production"
  PORT: "8090"
  AWS_REGION: "us-east-1"
  STORAGE_PROVIDER: "s3"
  S3_BUCKET: "blobcloud-storage"
  SQS_QUEUE_URL: "https://sqs.us-east-1.amazonaws.com/123456789012/blobcloud-jobs"
  SQS_NUM_WORKERS: "3"
  RATE_LIMIT_AUTH_PER_MIN: "10"
  RATE_LIMIT_UPLOAD_PER_MIN: "30"
  RATE_LIMIT_API_PER_MIN: "120"
